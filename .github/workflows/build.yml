name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Usa o Gradle 8.6 direto, então funciona mesmo sem gradlew no repositório.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Teste do núcleo (sem Minecraft)
        run: sh tools/run-core-test.sh

      - name: Build
        run: gradle build --no-daemon

      - name: Upload do mod
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-inside
          path: build/libs/*.jar
          if-no-files-found: error
