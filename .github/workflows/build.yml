name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache do Gradle (nao baixa o Gradle em si)
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # Baixa o Gradle 8.5 com varias tentativas e um espelho, para sobreviver a erros 504 temporarios
      - name: Install Gradle 8.5
        run: |
          set -e
          for url in \
            "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.5.0/gradle-8.5-bin.zip"; do
            echo "Baixando de $url"
            if curl -fSL --retry 6 --retry-delay 10 --retry-all-errors -o gradle.zip "$url"; then
              ok=1
              break
            fi
          done
          [ "${ok:-0}" = "1" ] || { echo "Nao foi possivel baixar o Gradle"; exit 1; }
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ipad-scute6o
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
